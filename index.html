<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./zulvanavis-portfolio/" />
    <title>Muhammad Zulva Navis | Portfolio</title>
    <style>
      :root {
        --bg: #f4f6f4;
        --card: #ffffff;
        --text: #182127;
        --muted: #586672;
        --line: #dfe5e8;
        --accent: #2e7b5d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #eef7f1 0%, #f7f8fb 100%);
        color: var(--text);
        display: grid;
        place-items: center;
      }
      .card {
        width: min(520px, calc(100vw - 32px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 28px;
        box-shadow: 0 20px 40px rgba(18, 25, 30, 0.08);
        text-align: center;
      }
      .badge {
        display: inline-block;
        background: #edf7f1;
        color: var(--accent);
        border: 1px solid #d2ebdf;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(2rem, 3vw, 2.6rem);
        margin: 18px 0 10px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: white;
        text-decoration: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
      }
      a:hover { filter: brightness(0.96); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Portfolio</div>
      <h1>Muhammad Zulva Navis</h1>
      <p>Halaman utama sedang dialihkan ke versi portfolio yang sudah siap. Jika browser Anda tidak otomatis berpindah, silakan klik tombol di bawah.</p>
      <a href="./zulvanavis-portfolio/">Buka Portfolio</a>
    </main>
  </body>
</html>
